short_bio: >-
  <p>I am a postdoctoral researcher at the National University of Singapore (NUS).
  I received my Ph.D. from the Institute of Information Engineering, Chinese Academy
  of Sciences. My research lies at the intersection of computer architecture and
  systems security, with an emphasis on building secure and reliable processors.</p>
  <p>My work develops scalable techniques for uncovering processor vulnerabilities,
  particularly through hardware fuzzing. I have studied diverse instruction generation,
  hardware-aware coverage metrics, mutation and seed-scheduling strategies, and the
  validation of non-standard instructions. I am also interested in side-channel security
  and hardware-assisted approaches to memory safety.</p>
  <p>My research has appeared in ACM CCS, ACSAC, IEEE Transactions on Dependable and
  Secure Computing, Computers &amp; Security, and The Computer Journal.</p>
  <h6>Research Interests</h6>
  <ul>
    <li>Processor security and verification</li>
    <li>Hardware fuzzing and automated vulnerability discovery</li>
    <li>Side-channel security</li>
    <li>Hardware-assisted memory safety</li>
  </ul>
