short_bio: >-
  <p>I am a postdoctoral researcher at the National University of Singapore (NUS).
  I received both my M.S. and Ph.D. degrees from the Institute of Information Engineering,
  Chinese Academy of Sciences.</p>
  <p>My research lies at the intersection of computer architecture and systems security,
  with a focus on the security and reliability of modern processors. I am interested
  in practical and scalable approaches to processor verification, hardware vulnerability
  discovery, side-channel security, and hardware-assisted memory safety.</p>
  <h6>Research Interests</h6>
  <ul>
    <li>Processor security and verification</li>
    <li>Hardware vulnerability discovery</li>
    <li>Side-channel security</li>
    <li>Hardware-assisted memory safety</li>
  </ul>
