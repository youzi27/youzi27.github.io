short_bio: "<p>I am a Ph.D. student at the Institute of Information Engineering, Chinese
  Academy of Sciences, where I also completed my Master’s degree in 2023. With a growing
  background in computer engineering and cybersecurity, I am eager to continue learning
  and contributing to research on processor security and reliability.</p><p>My current
  research focuses on processor security, where I explore innovative techniques to
  uncover hardware vulnerabilities and improve the security and robustness of modern
  CPUs.</p><p>Driven by curiosity and an open-minded approach, I actively engage in
  academic discussions and collaborative research projects. I enjoy bridging rigorous
  theoretical research with practical applications, aiming to contribute both to the
  scientific community and to the broader field of computer security.</p><h6>Research
  Interests</h6><ul><li>Processor Verification. My work focuses on discovering CPU
  vulnerabilities through fuzzing. I have addressed key challenges in CPU fuzzing,
  including test redundancy, imbalance, and false positives. Specifically, I (1) proposed
  diversified test construction, (2) introduced a novel coverage metric, (3) designed
  a new mutation algorithm, (4) overcame large-scale verification bottlenecks for
  non-standard instructions, and (5) pioneered a seed scheduling strategy tailored
  for CPU fuzzing.</li><li>Side-Channel Security. I have studied and reproduced various
  side-channel attacks, gaining practical insights into their mechanisms and countermeasures.</li><li>Memory
  Safety. I am interested in exploring memory safety from both hardware and system
  perspectives, including memory corruption detection, pointer integrity, and runtime
  monitoring techniques, aiming to mitigate security risks in modern processors.</li></ul><h6>Recent
  Projects</h6><ul><li>Developed fuzzing frameworks to identify pre-silicon bugs in
  RISC-V processors, effectively improving processor validation and verification.</li><li>Developed
  a framework for generating and testing non-standard instructions, which will be
  open-sourced on GitHub soon.</li><li>Current work will soon be released as an open-source
  project on GitHub to support the broader hardware security and verification community.</li></ul><h6>Patents</h6><ul><li>Test
  Instruction Generation Method, Apparatus, Device, and Medium for Processor Fuzz
  Testing.</li><li>Seed Mutation Method and Apparatus for Hardware Fuzz Testing.</li><li>Seed
  Scheduling Method and Apparatus for Hardware Fuzz Testing.</li></ul>"
