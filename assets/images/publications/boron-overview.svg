<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">BORON linear cryptanalysis overview</title>
  <desc id="desc">Linear approximations, key bridging, and Fast Walsh Transform lead to key recovery for BORON.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker></defs>
  <rect width="900" height="540" rx="28" fill="#f8fafc"/>
  <text x="450" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Improved Linear Cryptanalysis of BORON</text>
  <rect x="45" y="190" width="155" height="140" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><text x="122" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Plaintext</text><text x="122" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">known pairs</text>
  <rect x="265" y="160" width="170" height="200" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/><text x="350" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#5b21b6">BORON</text><text x="350" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#6d28d9">linear trails</text><text x="350" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569">11 / 13 rounds</text>
  <rect x="500" y="160" width="170" height="200" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/><text x="585" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#92400e">Key bridging</text><text x="585" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#92400e">fewer guessed</text><text x="585" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#92400e">key bits</text>
  <rect x="735" y="190" width="125" height="140" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/><text x="797" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14532d">Key</text><text x="797" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14532d">recovery</text>
  <path d="M200 260H255M435 260H490M670 260H725" stroke="#475569" stroke-width="5" marker-end="url(#a)"/>
  <rect x="350" y="414" width="300" height="68" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="500" y="456" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#991b1b">Fast Walsh Transform</text><path d="M500 414V370" stroke="#ef4444" stroke-width="4" marker-end="url(#a)"/>
</svg>
