<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">HScheduler overview</title>
  <desc id="desc">An execution-history-based scheduler exchanges seed characteristics with the mutator and shared memory.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker></defs>
  <rect width="900" height="540" rx="28" fill="#f8fafc"/>
  <text x="450" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">HScheduler</text>
  <rect x="70" y="120" width="265" height="300" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><text x="202" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Scheduler</text><rect x="105" y="190" width="195" height="58" rx="12" fill="#fff"/><text x="202" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Dynamic seed queue</text><rect x="105" y="270" width="195" height="58" rx="12" fill="#fff"/><text x="202" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Comparator</text><rect x="105" y="350" width="195" height="48" rx="12" fill="#fff"/><text x="202" y="381" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#334155">Seed maintainer</text>
  <rect x="565" y="120" width="265" height="210" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/><text x="697" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#5b21b6">Mutator</text><rect x="600" y="190" width="195" height="52" rx="12" fill="#fff"/><text x="697" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#334155">History analysis</text><rect x="600" y="260" width="195" height="48" rx="12" fill="#fff"/><text x="697" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#334155">Mutation</text>
  <rect x="565" y="370" width="265" height="90" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/><text x="697" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14532d">Shared memory</text><text x="697" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#166534">seed + characteristics</text>
  <path d="M335 205H555M565 285H345M565 415H345" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><text x="450" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">selected seed</text><text x="450" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">execution history</text>
</svg>
