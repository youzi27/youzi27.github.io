  <text x="450" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Hypnos Power Side Channel</text>
  <rect x="45" y="165" width="180" height="190" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><text x="135" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Victim</text><text x="135" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#1e40af">secret-dependent</text><text x="135" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#1e40af">activity</text>
