  <rect x="555" y="165" width="150" height="190" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/><text x="630" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#92400e">Power</text><text x="630" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#92400e">trace</text><path d="M585 310l20-28 18 22 20-48 25 58" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <rect x="735" y="165" width="130" height="190" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/><text x="800" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14532d">Secret</text><text x="800" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14532d">inference</text>
