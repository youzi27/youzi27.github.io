<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Hypnos attack overview</title>
  <desc id="desc">Victim activity changes CPU idle behavior, which creates observable power patterns used for side-channel inference.</desc>
