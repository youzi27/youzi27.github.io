  <rect x="245" y="425" width="410" height="62" rx="15" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="450" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#991b1b">Practical attack without performance counters</text>
