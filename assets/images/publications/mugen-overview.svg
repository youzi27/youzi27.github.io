  <rect x="670" y="320" width="190" height="130" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/><text x="765" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14532d">Differential</text><text x="765" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14532d">testing</text><text x="765" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#b91c1c">mismatch = bug</text>
