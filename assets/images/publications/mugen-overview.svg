<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">MUGEN overview</title>
  <desc id="desc">State-aware instruction generation combines ISA constraints, real-time architectural state, seed mutation, and differential testing.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker></defs>
  <rect width="900" height="540" rx="28" fill="#f8fafc"/>
  <text x="450" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">MUGEN State-Aware CPU Fuzzing</text>
  <rect x="40" y="120" width="210" height="310" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><text x="145" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">ISA oracle</text><rect x="72" y="195" width="146" height="50" rx="10" fill="#fff"/><text x="145" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">ISA features</text><rect x="72" y="260" width="146" height="50" rx="10" fill="#fff"/><text x="145" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">architectural state</text><rect x="72" y="325" width="146" height="72" rx="10" fill="#fff"/><text x="145" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">registers / CSR</text><text x="145" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">memory</text>
  <rect x="320" y="100" width="280" height="350" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/><text x="460" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#5b21b6">State-aware generation</text><rect x="360" y="180" width="200" height="50" rx="10" fill="#fff"/><text x="460" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">opcode sampling</text><rect x="360" y="250" width="200" height="72" rx="10" fill="#fff"/><text x="460" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">mutation-integrated</text><text x="460" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">operand scheduler</text><rect x="360" y="342" width="200" height="72" rx="10" fill="#fff"/><text x="460" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">semantic safeguards</text><text x="460" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">bug filtering</text>
