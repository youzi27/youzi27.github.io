<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">SIMON DS-MITM attack overview</title>
  <desc id="desc">Automatic constraint modeling connects forward and backward computations through a meet-in-the-middle match.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker></defs>
  <rect width="900" height="540" rx="28" fill="#f8fafc"/>
  <text x="450" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Automatic DS-MITM on SIMON</text>
  <rect x="55" y="170" width="170" height="180" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
  <text x="140" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Forward</text><text x="140" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1e40af">SIMON rounds</text><text x="140" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">key bridging</text>
  <rect x="365" y="185" width="170" height="150" rx="75" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
  <text x="450" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#92400e">MITM</text><text x="450" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#92400e">match</text>
  <rect x="675" y="170" width="170" height="180" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
  <text x="760" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#14532d">Backward</text><text x="760" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#166534">SIMON rounds</text><text x="760" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">key recovery</text>
  <path d="M225 260H355" stroke="#475569" stroke-width="5" marker-end="url(#a)"/><path d="M675 260H545" stroke="#475569" stroke-width="5" marker-end="url(#a)"/>
  <rect x="245" y="410" width="410" height="66" rx="15" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="450" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Constraint-programming model</text>
  <path d="M450 410V345" stroke="#8b5cf6" stroke-width="4" marker-end="url(#a)"/>
</svg>
